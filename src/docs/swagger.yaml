openapi: 3.0.0
info:
  title: Bank API
  version: "1.0.0"
  description: >
    A production-grade backend banking system built with a modular monolith architecture.
    Includes JWT authentication, secure transfers, and comprehensive validation.

servers:
  - url: http://localhost:3000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      # description: Enter your JWT token in the format: Bearer <token>

security:
  - bearerAuth: []

